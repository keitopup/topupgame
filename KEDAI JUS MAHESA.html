   +'<form id="f-pay" novalidate>'

   +'<div class="field"><label for="pm-bank">Nama bank <span class="hint">(untuk transfer)</span></label><input class="input" id="pm-bank" maxlength="40" placeholder="contoh: BCA" value="'+esc(p.bank)+'"></div>'

   +'<p class="err" id="pm-err" role="alert"></p><div class="actions"><button type="button" class="btn" data-act="close">Batal</button><button class="btn btn-primary">Terapkan</button></div></form>','pm-wa');

function qrPrevHtml(){return qrTmp?'<img src="'+esc(qrTmp)+'" alt="Pratinjau QR"><button type="button" class="btn btn-sm" data-act="qr-clear">Hapus QR</button>':'<span class="hint">Belum ada gambar QR.</span>'}
function readQr(file){
  return new Promise(function(res,rej){
    var fr=new FileReader();
    fr.onload=function(){
      var img=new Image();
      img.onload=function(){
        var sc=Math.min(1,600/Math.max(img.width,img.height)),c=document.createElement('canvas');
        c.width=Math.max(1,Math.round(img.width*sc));c.height=Math.max(1,Math.round(img.height*sc));
        var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);
        var out=c.toDataURL('image/png');
        if(out.length>350000)out=c.toDataURL('image/jpeg',.85);
        if(out.length>700000)return rej(new Error('big'));
        res(out);
      };
      img.onerror=function(){rej(new Error('img'))};
      img.src=fr.result;
    };
    fr.onerror=function(){rej(new Error('read'))};
    fr.readAsDataURL(file);
  });
}
function acctModal(){
  modal='acct';
  openModal('<h2>Akun owner</h2><p class="sub">Ubah username atau password. Berlaku setelah perubahan disimpan.</p>'
   +'<form id="f-acct" novalidate>'+pwField('ac-cur','Password saat ini','current-password')
   +'<div class="field"><label for="ac-user">Username baru</label><input class="input" id="ac-user" autocomplete="username" autocapitalize="none" value="'+esc(live.auth.user)+'"></div>'
   +pwField('ac-new','Password baru <span class="hint">(kosongkan jika tidak diganti)</span>','new-password')
   +pwField('ac-new2','Ulangi password baru','new-password')
   +'<p class="err" id="ac-err" role="alert"></p><div class="actions"><button type="button" class="btn" data-act="close">Batal</button><button class="btn btn-primary" id="ac-go">Terapkan</button></div></form>','ac-cur');
}

/* ---------- auth ---------- */
var hex=function(b){return Array.prototype.map.call(new Uint8Array(b),function(x){return x.toString(16).padStart(2,'0')}).join('')};
var unhex=function(h){return new Uint8Array(h.match(/../g).map(function(x){return parseInt(x,16)}))};
async function hashPw(user,pw,saltHex,iter){
  var key=await crypto.subtle.importKey('raw',new TextEncoder().encode(user.trim().toLowerCase()+':'+pw),'PBKDF2',false,['deriveBits']);
  return hex(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:unhex(saltHex),iterations:iter},key,256));
}
async function verify(user,pw){
  var a=live.auth;
  if(!window.crypto||!crypto.subtle)throw new Error('nocrypto');
  if(user.trim().toLowerCase()!==a.user.toLowerCase()){await sleep(500);return false}
  return (await hashPw(a.user,pw,a.salt,a.iter))===a.hash;
}

/* ---------- toast & save ---------- */
function toast(msg){
  toastRoot.innerHTML='<div class="toast">'+esc(msg)+'</div>';
  clearTimeout(toastTimer);toastTimer=setTimeout(function(){toastRoot.innerHTML=''},3200);
}
function buildDoc(state){
  var style=document.getElementById('app-style').textContent;
  var code=document.getElementById('app-code').textContent;
  var json=ser(state).replace(/</g,'\\u003c');
  var head='<title>'+esc(state.shop.name)+'</title><meta name="claude:viewport-fit-sides" content="cover"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="'+FONT_URL+'">';
  var S='</'+'script>';
  return SKEL_HEAD+head+'\n<style id="app-style">'+style+'</style>\n<div id="app"></div>\n<div id="modal-root"></div>\n<div id="toast-root" aria-live="polite"></div>\n<script type="application/json" id="state">'+json+S+'\n<script id="app-code">'+code+S+'</body></html>';
}
async function save(){
  if(saving||!isDirty())return;
  if(!artifactCap){toast('Penyimpanan belum tersedia di tampilan ini.');return}
  saving=true;render();
  try{await artifactCap.publish(buildDoc(draft))}
  catch(e){
    saving=false;var c=e&&e.code;
    if(c==='conflict'){/* the page reloads to the newer version */}
    else if(c==='not_writer'||c==='not_granted'||c==='not_declared'||c==='consent_required'||c==='capability_disabled'||c==='capability_removed'){readOnly=true;toast('Akun ini tidak bisa menyimpan perubahan.')}
    else if(c==='rate_limited'){toast('Terlalu sering menyimpan. Coba lagi sebentar lagi.')}
    else if(c==='too_large'){toast('Data terlalu besar untuk disimpan.')}
    else toast('Gagal menyimpan. Coba lagi.');
    render();
  }
}

/* ---------- events ---------- */
function setQty(n){
  qtyDraft=Math.max(1,Math.min(99,n));
  var it=itemById(qtyItem),v=document.getElementById('q-val'),s=document.getElementById('q-sub');
  if(v)v.textContent=qtyDraft;if(s&&it)s.textContent=qSub(it,qtyDraft);
}
document.addEventListener('click',function(ev){
  var t=ev.target.closest('[data-act]');if(!t)return;
  var act=t.getAttribute('data-act'),id=t.getAttribute('data-id');
  if(act==='overlay'){if(ev.target===t)closeModal();return}
  switch(act){
    case 'tab':tab=t.getAttribute('data-tab');render();break;
    case 'pick':qtyModal(id);break;
    case 'q-minus':setQty(qtyDraft-1);break;
    case 'q-plus':setQty(qtyDraft+1);break;
    case 'q-remove':delete cart[qtyItem];persistCart();closeModal();render();toast('Dihapus dari pesanan.');break;
    case 'order':if(!totals().cnt)break;view='pay';go('pembayaran');render();toTop();break;
    case 'back':view='menu';go('');render();toTop();break;
    case 'back-pay':view='pay';render();toTop();break;
    case 'l-minus':if((cart[id]||0)<=1)delete cart[id];else cart[id]--;persistCart();render();break;
    case 'l-plus':cart[id]=Math.min(99,(cart[id]||0)+1);persistCart();render();break;
    case 'copy':
      var txt=t.getAttribute('data-text');
      try{navigator.clipboard.writeText(txt).then(function(){toast('Nomor rekening disalin.')},function(){toast('Salin manual: '+txt)})}catch(e){toast('Salin manual: '+txt)}
      break;
    case 'confirm':setTimeout(function(){view='done';render();toTop()},60);break;
    case 'finish':cart={};buyer='';note='';method=null;persistCart();view='menu';go('');render();toTop();break;
    case 'login-open':loginModal();break;
    case 'close':closeModal();break;
    case 'pw-toggle':var inp=document.getElementById(t.getAttribute('data-target'));var show=inp.type==='password';inp.type=show?'text':'password';t.textContent=show?'Sembunyikan':'Lihat';break;
    case 'logout':if(isDirty()){toast('Simpan atau batalkan perubahan dulu.');break}loggedIn=false;sset(AUTH_KEY,null);confirmId=null;render();break;
    case 'add':itemModal(null,t.getAttribute('data-cat'));break;
    case 'edit':itemModal(id);break;
    case 'toggle':mutate(function(s){s.items.forEach(function(i){if(i.id===id)i.soldOut=!i.soldOut})});break;
    case 'del':confirmId=id;render();break;
    case 'del-no':confirmId=null;render();break;
    case 'del-yes':confirmId=null;delete cart[id];persistCart();mutate(function(s){s.items=s.items.filter(function(i){return i.id!==id})});toast('Menu dihapus. Jangan lupa simpan.');break;
    case 'shop-open':shopModal();break;
    case 'pay-open':payModal();break;
    case 'qr-clear':qrTmp='';var pv=document.getElementById('qr-prev');if(pv)pv.innerHTML=qrPrevHtml();break;
    case 'acct-open':acctModal();break;
    case 'discard':draft=null;persist();confirmId=null;render();break;
    case 'save':save();break;
  }
});
document.addEventListener('input',function(ev){
  var t=ev.target;
  if(t.id==='buyer'){buyer=t.value;persistCart();updateWaLink()}
  else if(t.id==='note'){note=t.value;persistCart();updateWaLink()}
});
document.addEventListener('change',async function(ev){
  var t=ev.target;
  if(t.name==='method'){
    method=t.value;render();
    var r=document.querySelector('input[name="method"][value="'+method+'"]');if(r)r.focus();
  }else if(t.id==='pm-qr'&&t.files&&t.files[0]){
    var er=document.getElementById('pm-err');if(er)er.textContent='';
    try{qrTmp=await readQr(t.files[0]);var pv=document.getElementById('qr-prev');if(pv)pv.innerHTML=qrPrevHtml()}
    catch(e){if(er)er.textContent=e&&e.message==='big'?'Gambar terlalu besar. Pakai gambar yang lebih kecil.':'Gambar tidak bisa dibaca. Coba file lain.'}
  }
});
window.addEventListener('hashchange',function(){
  var onPay=location.hash==='#pembayaran';
  if(view==='done'&&onPay)return;
  var want=(onPay&&totals().cnt>0)?'pay':'menu';
  if(want!==view){view=want;render();toTop()}
});
document.addEventListener('keydown',function(ev){if(ev.key==='Escape'&&modal)closeModal()});
document.addEventListener('submit',async function(ev){
  var f=ev.target;ev.preventDefault();
  if(f.id==='f-qty'){
    var it0=itemById(qtyItem);if(!it0||it0.soldOut){closeModal();return}
    var had=!!cart[qtyItem];cart[qtyItem]=qtyDraft;persistCart();closeModal();render();
    toast((had?'Diperbarui: ':'Ditambahkan: ')+it0.name+' x'+qtyDraft);
  }else if(f.id==='f-login'){
    var err=document.getElementById('li-err'),go2=document.getElementById('li-go');err.textContent='';go2.disabled=true;
    try{
      var ok=await verify(document.getElementById('li-user').value,document.getElementById('li-pw').value);
      if(ok){loggedIn=true;sset(AUTH_KEY,'1');closeModal();render();toast('Berhasil masuk.')}
      else{err.textContent='Username atau password salah.';go2.disabled=false}
    }catch(e){err.textContent='Browser ini tidak mendukung login. Coba browser lain.';go2.disabled=false}
  }else if(f.id==='f-item'){
    var id=f.getAttribute('data-id'),name=document.getElementById('it-name').value.trim(),e2=document.getElementById('it-err');
    if(!name){e2.textContent='Nama menu wajib diisi.';return}
    var raw=document.getElementById('it-price').value.replace(/[^0-9]/g,''),price=raw===''?null:parseInt(raw,10);
    var rec={cat:f.elements.cat.value,name:name,desc:document.getElementById('it-desc').value.trim(),price:price,tone:parseInt(f.elements.tone.value,10)||1,soldOut:document.getElementById('it-sold').checked};
    mutate(function(s){
      if(id){s.items.forEach(function(i){if(i.id===id){Object.assign(i,rec)}})}
      else{rec.id='i'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);s.items.push(rec)}
    });
    closeModal();toast(id?'Menu diperbarui. Jangan lupa simpan.':'Menu ditambahkan. Jangan lupa simpan.');
  }else if(f.id==='f-shop'){
    var nm=document.getElementById('sh-name').value.trim();
    if(!nm){document.getElementById('sh-err').textContent='Nama toko wajib diisi.';return}
    mutate(function(s){s.shop.name=nm;s.shop.tagline=document.getElementById('sh-tag').value.trim()});
    closeModal();toast('Info toko diubah. Jangan lupa simpan.');
  }else if(f.id==='f-pay'){
    var pe=document.getElementById('pm-err'),wd=document.getElementById('pm-wa').value.replace(/\D/g,'');
    if(wd.length<9||wd.length>15){pe.textContent='Nomor WhatsApp tidak valid.';return}
    if(wd.indexOf('0')===0)wd='62'+wd.slice(1);
    var pay={bank:document.getElementById('pm-bank').value.trim(),acct:document.getElementById('pm-acct').value.trim(),holder:document.getElementById('pm-holder').value.trim(),qr:qrTmp};
    mutate(function(s){s.shop.wa=wd;s.pay=pay});
    closeModal();toast('Pengaturan pembayaran diubah. Jangan lupa simpan.');
  }else if(f.id==='f-acct'){
    var er=document.getElementById('ac-err'),btn=document.getElementById('ac-go');er.textContent='';
    var cur=document.getElementById('ac-cur').value,nu=document.getElementById('ac-user').value.trim(),p1=document.getElementById('ac-new').value,p2=document.getElementById('ac-new2').value;
    if(!nu){er.textContent='Username tidak boleh kosong.';return}
    if(p1&&p1.length<8){er.textContent='Password baru minimal 8 karakter.';return}
    if(p1!==p2){er.textContent='Ulangi password baru dengan sama persis.';return}
    btn.disabled=true;
    try{
      var ok2=await verify(live.auth.user,cur);
      if(!ok2){er.textContent='Password saat ini salah.';btn.disabled=false;return}
      var saltBytes=crypto.getRandomValues(new Uint8Array(16)),salt=hex(saltBytes),finalPw=p1||cur;
      var hash=await hashPw(nu,finalPw,salt,100000);
      mutate(function(s){s.auth={user:nu,salt:salt,iter:100000,hash:hash}});
      closeModal();toast('Akun diubah. Jangan lupa simpan.');
    }catch(e){er.textContent='Gagal mengubah akun. Coba lagi.';btn.disabled=false}
  }
});

if(location.hash==='#pembayaran'&&totals().cnt>0)view='pay';
render();
})();
</script>
